<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />

    <!-- Icons: modern browsers take the SVG; the .ico is the legacy fallback. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <meta
      name="description"
      content="Biszaal Tech is an independent software studio run by Bishal Aryal. We design and build mobile apps, websites, backends and product design for people and businesses."
    />
    <meta name="author" content="Bishal Aryal" />

    <!--
      Every social scraper (Facebook, WhatsApp, LinkedIn, Slack, X) reads this
      static head and none of them run JavaScript, so all og:/twitter: tags live
      here rather than being rendered from React. Per-route <title> and canonical
      come from src/components/Seo.tsx.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Biszaal Tech" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://www.biszaaltech.com/" />
    <meta property="og:title" content="Biszaal Tech — websites, mobile apps and custom software" />
    <meta
      property="og:description"
      content="An independent software studio. We design and build mobile apps, websites, backends and the product design that holds them together."
    />
    <meta property="og:image" content="https://www.biszaaltech.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The Biszaal Tech monogram above the words: We build the software you have in mind."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Biszaal Tech — websites, mobile apps and custom software" />
    <meta
      name="twitter:description"
      content="An independent software studio. We design and build mobile apps, websites, backends and the product design that holds them together."
    />
    <meta name="twitter:image" content="https://www.biszaaltech.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Biszaal Tech — websites, mobile apps and custom software</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Biszaal Tech",
        "founder": { "@type": "Person", "name": "Bishal Aryal" },
        "url": "https://www.biszaaltech.com/",
        "logo": "https://www.biszaaltech.com/apple-touch-icon.png",
        "image": "https://www.biszaaltech.com/og-image.png",
        "email": "biszaaltech@gmail.com",
        "telephone": "+447506369422",
        "foundingDate": "2025",
        "areaServed": "Worldwide",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Software services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile app development (iOS and Android)" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website and web app development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Backend, API and cloud engineering" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Product design (UI/UX)" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
